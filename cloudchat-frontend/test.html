<!DOCTYPE html>
<html>
<head>
    <title>CloudChats WS Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { background: #f4f4f4; padding: 10px; border-radius: 5px; height: 300px; overflow-y: auto; }
        .msg { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>CloudChats WebSocket Listener</h2>
    <p>Status: <strong id="status" style="color: orange;">Connecting...</strong></p>
    <p>Listening to <strong>/topic/thread/1</strong></p>
    
    <div id="log"></div>

    <script>
        // 1. Connect to your Spring Boot endpoint
        const socket = new SockJS('http://localhost:8080/ws-chat');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = "Connected!";
            document.getElementById('status').style.color = "green";
            
            // 2. Subscribe to Thread ID 1
            stompClient.subscribe('/topic/thread/1', function (message) {
                const log = document.getElementById('log');
                const newMsg = document.createElement('div');
                newMsg.className = 'msg';
                newMsg.innerText = "Received: " + message.body;
                log.prepend(newMsg);
            });
        }, function(error) {
            document.getElementById('status').innerText = "Connection Failed. Check Spring Security.";
            document.getElementById('status').style.color = "red";
            console.error(error);
        });
    </script>
</body>
</html>
