<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudChats MVP</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        /* Custom sleek scrollbar */
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-200 h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <!-- App Container -->
    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[85vh] border border-slate-200">

        <!-- Header -->
        <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-xl shadow-inner">
                    ☁️
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">CloudChats</h1>
                    <p class="text-xs text-slate-400">Thread #1 <span id="status-dot" class="inline-block w-2 h-2 bg-red-500 rounded-full ml-1"></span></p>
                </div>
            </div>
        </div>

        <!-- Setup Panel (JWT & Username) -->
        <div id="setup-panel" class="bg-slate-50 p-4 border-b border-slate-200 flex flex-wrap gap-3 shrink-0 items-center">
            <input type="text" id="username-input" placeholder="My Username (e.g. u1)" class="w-1/4 min-w-[120px] px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" value="u1">
            <input type="password" id="jwt-input" placeholder="Paste Bearer Token Here..." class="flex-1 min-w-[200px] px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
            <button id="connect-btn" onclick="connect()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 text-sm font-semibold rounded-lg transition-colors shadow-sm">
                Connect
            </button>
        </div>

        <!-- Chat Window -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 bg-slate-50/50 flex flex-col gap-4">
            <div class="text-center text-xs text-slate-400 my-2">Waiting for WebSocket connection...</div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-slate-200 shrink-0">
            <form id="message-form" class="flex gap-3" onsubmit="sendMessage(event)">
                <input type="text" id="message-input" placeholder="Type a message..." disabled class="flex-1 px-4 py-3 bg-slate-100 border-transparent focus:bg-white border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" autocomplete="off">
                <button type="submit" id="send-btn" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white px-6 py-3 font-semibold rounded-xl transition-colors shadow-sm flex items-center justify-center">
                    <!-- Paper Airplane Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        let stompClient = null;
        let currentUsername = "";

        function connect() {
            const jwt = document.getElementById('jwt-input').value.trim();
            currentUsername = document.getElementById('username-input').value.trim();
            const btn = document.getElementById('connect-btn');

            if (!jwt || !currentUsername) {
                alert("Please enter both a Username and a JWT Token.");
                return;
            }

            btn.innerText = "Connecting...";
            btn.disabled = true;

            const socket = new SockJS('http://127.0.0.1:8080/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // Turns off console spam

            stompClient.connect({}, function (frame) {
                // Update UI on success
                document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-green-500');
                btn.innerText = "Connected";
                btn.classList.replace('bg-slate-800', 'bg-green-600');
                document.getElementById('message-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                
                document.getElementById('chat-window').innerHTML = `
                    <div class="text-center text-xs text-slate-400 my-2">Joined Thread #1 as <strong>${currentUsername}</strong></div>
                `;

                // Subscribe to the broker
                stompClient.subscribe('/topic/thread/1', function (message) {
                    const payload = JSON.parse(message.body);
                    renderMessage(payload);
                });
            }, function (error) {
                btn.innerText = "Connect";
                btn.disabled = false;
                alert("WebSocket Connection failed. Check terminal logs.");
            });
        }

        async function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            const jwt = document.getElementById('jwt-input').value.trim();

            if (!content) return;

            const payload = {
                threadId: 1,
                content: content
            };

            input.value = ''; // Clear input instantly for snappy UI

            try {
                const response = await fetch('http://127.0.0.1:8080/api/messages/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + jwt
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
            } catch (error) {
                console.error("Failed to send:", error);
            }
        }

        function renderMessage(payload) {
            const chatWindow = document.getElementById('chat-window');
            
            // Logic to check if the message is mine (Right) or someone else's (Left)
            const isMine = payload.sender_username === currentUsername;
            
            // Format the raw timestamp into a clean hour:minute display
            const time = new Date(payload.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const alignClass = isMine ? 'self-end' : 'self-start';
            const bubbleClass = isMine ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none shadow-sm';
            const senderLabel = isMine ? '' : `<div class="text-[10px] font-bold text-slate-400 mb-1 ml-1">${payload.sender_username}</div>`;

            const msgElement = document.createElement('div');
            msgElement.className = `flex flex-col max-w-[75%] ${alignClass}`;
            msgElement.innerHTML = `
                ${senderLabel}
                <div class="px-4 py-2.5 rounded-2xl ${bubbleClass} text-sm">
                    ${payload.content}
                </div>
                <div class="text-[10px] text-slate-400 mt-1 ${isMine ? 'text-right mr-1' : 'ml-1'}">
                    ${time}
                </div>
            `;

            chatWindow.appendChild(msgElement);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to bottom
        }
    </script>
</body>
</html>
